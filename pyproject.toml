[project]
name = "difficulty-timewarp"
version = "1.0.0"
description = "Project 09: Difficulty algorithms and the time-warp attack"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.1"]

[project.scripts]
demo = "difficulty_timewarp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regtest: tests that require a Bitcoin node"]
